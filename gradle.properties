org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# Extract backend (backend/server.py), deployed on Render (free plan, sleeps when idle).
# For local testing use http://<PC Wi-Fi IP>:8000/ (debug builds allow plain http).
API_BASE_URL=https://savr-backend-qzjs.onrender.com/

# AdMob (release only; debug uses Google test IDs). Replace with your IDs from admob.google.com
ADMOB_APP_ID=
ADMOB_BANNER_ID=
ADMOB_INTERSTITIAL_ID=

# The Kotlin compile daemon fails to connect on this machine; compile inside the Gradle daemon instead
kotlin.compiler.execution.strategy=in-process
