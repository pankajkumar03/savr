org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# Extract backend (backend/server.py). Debug builds allow plain http so a PC on the same Wi-Fi works;
# use an https URL for release builds.
API_BASE_URL=http://192.168.31.58:8000/

# AdMob (release only; debug uses Google test IDs). Replace with your IDs from admob.google.com
ADMOB_APP_ID=
ADMOB_BANNER_ID=
ADMOB_INTERSTITIAL_ID=

# The Kotlin compile daemon fails to connect on this machine; compile inside the Gradle daemon instead
kotlin.compiler.execution.strategy=in-process
